{% extends "base.html" %}

{% block content %}
<div class="container mx-auto mt-10 max-w-3xl p-4 bg-white rounded shadow">

    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">🪲 Bug Report Management</h2>

    <!-- Download Button -->
    <div class="mb-6 text-center">
        <a href="{% url 'django_bugapp:bug_reports' %}?download=true"
           class="btn btn-success bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded shadow">
            📥 Download Bug Report
        </a>
    </div>

    <!-- Upload Form -->
    <form method="post" enctype="multipart/form-data"
          class="bg-gray-50 p-6 border border-gray-200 rounded-lg shadow-sm">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Upload Excel File</label>
            {{ form.file }}
            {% if form.file.errors %}
                <div class="text-red-500 text-sm mt-2">{{ form.file.errors.0 }}</div>
            {% endif %}
        </div>
        <button type="submit"
                class="btn btn-primary bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
            ⬆️ Upload Excel to Update Status
        </button>
    </form>

</div>
{% endblock %}
